name: Ecosystem hygiene receive

# Companion to ecosystem-hygiene-sync.yml in the source repo. When ANOTHER
# repo in the ecosystem changes _DEV_HYGIENE.md or MIRROR_TARGETS.md and
# dispatches an `ecosystem-hygiene-sync` repository_dispatch to us, this
# workflow opens (or updates) a PR that brings our copy of the file in
# line with theirs.
#
# This file should be byte-identical across spellcaster, spellcaster_NSFW,
# Voodoomancer, Laborantin, and whimweaver — itself an instance of the
# rule it operationalises. Drift in this workflow is caught by the
# workflow.
#
# client_payload schema:
#   source_repo:   GitHub "owner/repo" the change originated in
#   filename:      _DEV_HYGIENE.md | MIRROR_TARGETS.md
#   sha:           the commit SHA on the source repo
#   content_b64:   base64 of the new file content

on:
  repository_dispatch:
    types: [ ecosystem-hygiene-sync ]

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Decode incoming file
        id: decode
        env:
          FILE: ${{ github.event.client_payload.filename }}
          SRC: ${{ github.event.client_payload.source_repo }}
          SHA: ${{ github.event.client_payload.sha }}
          CONTENT_B64: ${{ github.event.client_payload.content_b64 }}
        run: |
          set -euo pipefail
          case "$FILE" in
            _DEV_HYGIENE.md|MIRROR_TARGETS.md) ;;
            *) echo "::error::unsupported filename: $FILE"; exit 1 ;;
          esac
          printf '%s' "$CONTENT_B64" | base64 -d > /tmp/incoming
          echo "filename=$FILE" >> "$GITHUB_OUTPUT"
          echo "source_repo=$SRC" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Compare with local copy
        id: diff
        env:
          F: ${{ steps.decode.outputs.filename }}
        run: |
          set -euo pipefail
          if [ ! -f "$F" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing-locally" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if cmp -s "$F" /tmp/incoming; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "reason=byte-mismatch" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if already in sync
        if: steps.diff.outputs.drift == 'false'
        run: echo "Already byte-identical with ${{ steps.decode.outputs.source_repo }} @ ${{ steps.decode.outputs.source_sha }}; nothing to do."

      - name: Apply incoming and open PR
        if: steps.diff.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          F: ${{ steps.decode.outputs.filename }}
          SRC: ${{ steps.decode.outputs.source_repo }}
          SHA: ${{ steps.decode.outputs.source_sha }}
          REASON: ${{ steps.diff.outputs.reason }}
        run: |
          set -euo pipefail
          BRANCH="auto/hygiene-sync-${F%.md}"
          BRANCH="${BRANCH//_/-}"

          git config user.name  "ecosystem-doctor[bot]"
          git config user.email "ecosystem-doctor@users.noreply.github.com"
          git checkout -B "$BRANCH"
          cp /tmp/incoming "$F"
          git add "$F"

          if git diff --cached --quiet; then
            echo "No staged diff; another dispatch may have already synced. Exiting."
            exit 0
          fi

          git commit -m "chore: sync $F from $SRC@${SHA:0:7} ($REASON)"
          git push --force-with-lease origin "$BRANCH"

          # Build PR body in a tempfile so quoting + multiline are clean.
          short_sha="${SHA:0:7}"
          cat > /tmp/pr-body.md <<BODY_EOF
          Automated sync triggered by a change to \`$F\` in [$SRC](https://github.com/$SRC) at commit \`$short_sha\`.

          This file is declared byte-identical across the ecosystem (spellcaster,
          spellcaster_NSFW, Voodoomancer, Laborantin, whimweaver). Drift is caught
          by \`scripts/ecosystem_doctor.py verify\`.

          Reviewer checklist:
          - [ ] Incoming change matches the merge commit on the source side
          - [ ] No unintended local-repo-specific edits got bundled
          - [ ] CI green (the receiving repo's pre-commit hook should pass — if it doesn't, the source side may have introduced a leak the source's hook missed)

          Source: $SRC@$SHA
          Reason: $REASON
          Triggered by: \`ecosystem-hygiene-sync\` repository_dispatch
          Generated by: \`.github/workflows/ecosystem-hygiene-receive.yml\`
          BODY_EOF

          existing=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            echo "PR #$existing already open on $BRANCH; pushed update."
            gh pr edit "$existing" --body-file /tmp/pr-body.md || true
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: sync $F from ecosystem ($SRC)" \
              --body-file /tmp/pr-body.md
          fi
