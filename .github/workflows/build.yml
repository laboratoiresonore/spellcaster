name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_nsfw:
        description: 'Also build NSFW edition'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow requests darkdetect
      - name: Build Windows installer + updater
        run: python installer/build_installer.py --platform windows --update-tool
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/spellcaster-installer.exe
            dist/spellcaster-manual-update.exe

  build-windows-nsfw:
    runs-on: windows-latest
    if: ${{ github.event.inputs.build_nsfw == 'true' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow requests darkdetect
      - name: Build NSFW Windows installer
        run: python nsfw/build_nsfw.py
      - name: Upload NSFW artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsfw-installer
          path: |
            nsfw/dist/spellcaster-nsfw-installer.exe
            nsfw/dist/spellcaster-nsfw-updater.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow requests darkdetect
      - name: Build macOS .app bundle
        run: python installer/build_installer.py --platform macos --onedir
      - name: Build macOS single binary + updater
        run: python installer/build_installer.py --platform macos --update-tool
      - name: Zip macOS app bundle
        run: cd dist && zip -r "../spellcaster-installer-macos.zip" "Spellcaster Installer.app"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            spellcaster-installer-macos.zip
            dist/spellcaster-installer
            dist/spellcaster-manual-update

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow requests darkdetect
      - name: Build Linux installer + updater
        run: python installer/build_installer.py --platform linux --update-tool
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            dist/spellcaster-installer
            dist/spellcaster-manual-update

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-installer/spellcaster-installer.exe
            windows-installer/spellcaster-manual-update.exe
            macos-installer/spellcaster-installer-macos.zip
            macos-installer/spellcaster-installer
            macos-installer/spellcaster-manual-update
            linux-installer/spellcaster-installer
            linux-installer/spellcaster-manual-update
          generate_release_notes: true
          draft: true
