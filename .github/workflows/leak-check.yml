# Greps tracked files for internal project names, PII, and token prefixes.
# Fails the build on any hit.
#
# The pattern list is sourced from .githooks/leak-patterns -- the SAME file
# used by .githooks/pre-commit and .githooks/pre-push. Editing that one file
# updates the local hooks AND this workflow together (Issue #12).
#
# Self-excludes the three files that carry the patterns (the workflow itself,
# the pre-push hook's fallback, and the pattern list) so they don't trip the
# scan they define.
name: Leak check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: git grep for forbidden patterns
        shell: bash
        run: |
          set -uo pipefail
          # Token patterns require >=20 chars of token body so that
          # legitimate prefix-validation code (e.g.
          # ``tok.startswith("ghp_")``) doesn't trip the scan. Real
          # GitHub PATs are 40+ chars after the prefix; we floor at 20
          # to keep the pattern strict but tolerant of future variants.
          if [ ! -r .githooks/leak-patterns ]; then
            echo "::error::.githooks/leak-patterns is missing -- cannot run leak scan"
            exit 1
          fi
          patterns="$(grep -vE '^\s*(#|$)' .githooks/leak-patterns | tr '\n' '|' | sed 's/|$//')"
          if [ -z "$patterns" ]; then
            echo "::error::.githooks/leak-patterns parsed empty -- cannot run leak scan"
            exit 1
          fi
          # -i: the hardcoded-credential idiom matches "Password", "PASSWORD",
          # etc. -- the pattern list is written lower-case and relies on -i
          # (see the NOTE in .githooks/leak-patterns).
          if git grep -nIEi "$patterns" -- \
              ':!.github/workflows/leak-check.yml' \
              ':!.githooks/pre-push' \
              ':!.githooks/leak-patterns'; then
            echo "::error::Forbidden pattern detected in tracked files (see hits above)"
            exit 1
          fi
          echo "Scan clean."
