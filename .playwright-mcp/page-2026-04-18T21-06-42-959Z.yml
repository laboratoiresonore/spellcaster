          - generic [ref=e115]:
            - paragraph [ref=e116]:
              - strong [ref=e117]: Why "scaffolding" matters.
            - paragraph [ref=e118]:
              - img "The Wizard Guild" [ref=e119]
            - paragraph [ref=e120]:
              - text: Local language models are
              - emphasis [ref=e121]: small
              - text: . A 7B-parameter model is brilliant at conversation but terrible at remembering long instructions or producing valid JSON. If you just asked one to "drive ComfyUI", it would hallucinate node names, forget parameters, mix up models, and generally embarrass itself.
            - paragraph [ref=e122]:
              - text: So we don't ask it to. Instead, we
              - strong [ref=e123]: scaffold
              - text: it.
            - paragraph [ref=e124]: "For every wizard you meet, the scaffold:"
            - list [ref=e125]:
              - listitem [ref=e126]:
                - strong [ref=e127]: Inspects your ComfyUI
                - text: to see what models, LoRAs, and custom nodes
            - paragraph [ref=e128]: you actually have installed.
            - list [ref=e129]:
              - listitem [ref=e130]:
                - strong [ref=e131]: Builds a tiny menu
                - text: of just the relevant tools for that wizard's
            - paragraph [ref=e132]: specialty (Imaginus does image generation, Restorix does upscaling, Videomancer does video, etc.).
            - list [ref=e133]:
              - listitem [ref=e134]:
                - strong [ref=e135]: Hands the LLM a numbered choice list
                - text: instead of an open-ended
            - paragraph [ref=e136]: blank page. The model picks a number. We turn the number into a workflow.
            - list [ref=e137]:
              - listitem [ref=e138]:
                - strong [ref=e139]: Validates the result
                - text: before submitting it to ComfyUI, so a
            - paragraph [ref=e140]: confused LLM can't crash a generation.
            - paragraph [ref=e141]:
              - text: That's how a 7B model can flawlessly drive a 49-tool image suite. The intelligence isn't in the LLM — it's in the
              - emphasis [ref=e142]: constraints
              - text: we wrap around it.
            - paragraph [ref=e143]: You can inspect every wizard's scaffold yourself in the **Travelling Wizard** — the 🧙 button in the lower-left corner of the sidebar (right above ⚙️ Settings). It shows the live workflow JSON, the parameter menus, and the auto-discovered LoRA list each wizard sees. If a wizard is misbehaving, that's where you go to debug them.
