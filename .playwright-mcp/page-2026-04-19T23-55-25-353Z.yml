lity (2-stage): latent upscale pipeline\\n - Cinematic: 2-stage + AI upscale 2x + RIFE, 49 frames\\n - Fast + smooth: distilled + RIFE\\n\\n-- VIDEO ENHANCEMENT --\\n4. **Video Upscale** (build_video_upscale) — Upscale video with AI models.\\n Key params: video_name, upscale_model, upscale_factor, rtx_scale, fps\\n\\n5. **Video Face Swap** (build_video_reactor) — Face swap every frame + upscale.\\n Key params: video_name, face_models (list), upscale_model, rtx_scale, fps\\n PRESETS:\\n - Standard: UltraSharp + AI upscale 2x + CodeFormer 0.7\\n - Quality: AI upscale only + CodeFormer 0.5\\n\\n6. **SeedVR2 Video Upscale** (build_seedvr2_video_upscale) — AI temporal upscaling.\\n Key params: video_name, seed, resolution, max_resolution, batch_size\\n Options: color_correction (lab/wavelet/hsv/adain/none), temporal_overlap\\n PRESETS:\\n - Standard: 1024 to 2048, batch 4, lab color correction\\n - High quality: 2048 to 4096, batch 2, temporal overlap 4\\n - Fast preview: 720 to 1080, batch 8\\n\\n-- UTILITY --\\n7. **Frame Assembly** (build_frame_assembly) — Assemble image frames into MP4.\\n Key params: frame_filenames (list of paths), fps, filename_prefix\\n\\nDECISION GUIDE:\\n- Animate a photo: tool 1 (WAN I2V) best quality, 8-16GB VRAM\\n- Transition between two photos: tool 2 (WAN FLF)\\n- Generate video from text only: tool 3 (LTX) no input image needed\\n- Upscale existing video: tool 4 (traditional) or 6 (SeedVR2 AI)\\n- Face swap on video: tool 5 (video_reactor)\\n\\nPROTOCOL:\\n- Ask what the user wants: generate new video or enhance existing?\\n- For generation: ask for image (WAN) or text prompt (LTX)\\n- Offer presets first (Quick preview / Standard / High quality / Cinematic)\\n- Collect remaining params conversationally\\n- Output JSON: {\\\"build_fn\\\": \\\"...\\\", \\\"params\\\": {...}}\\n\", \"system_prompt_rules\": [], \"steps\": [], \"nsfw\": false, \"admin_only\": false, \"lora_slots\": [], \"color1\": \"hsl(180, 85%, 35%)\", \"color2\": \"hsl(14